name: Build and publish Docker images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild (e.g. v5.8.5)"
        required: true
        type: string
      latest:
        description: "Also move latest and the X.Y tags to this release"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  release-approval:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Validate tag input
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid tag: $TAG"; exit 1; }

      - name: Release approved
        run: echo "Environment 'release' approved; publishing container images."

  build-and-push:
    needs: release-approval
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        include:
          - image: bigipreport-frontend
            context: frontend
          - image: bigipreport-data-collector
            context: data-collector

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            # Git tag is v* (keep that). Publish both bare semver and v-prefixed image tags for pulls either way.
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ github.event_name == 'push' || inputs.latest }}
            type=semver,pattern=v{{version}},value=${{ inputs.tag }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ github.event_name == 'push' || inputs.latest }}
          flavor: |
            latest=${{ github.event_name == 'push' && 'auto' || inputs.latest }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

