name: Package and publish Helm chart

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild (e.g. v5.8.5)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  release-approval:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Validate tag input
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid tag: $TAG"; exit 1; }

      - name: Release approved
        run: echo "Environment 'release' approved; publishing Helm chart."

  push-helm-chart:
    needs: release-approval
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Resolve chart version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Validate config source
        run: |
          if [[ ! -f "data-collector/bigipreportconfig.xml" ]]; then
            echo "Missing data-collector/bigipreportconfig.xml in repository."
            exit 1
          fi

      - name: Log in to ghcr.io
        run: |
          helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}"

      - name: Lint, package, and push chart
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p chart-dist
          helm lint helm/ --set-file config.xml=data-collector/bigipreportconfig.xml
          helm package helm/ --version "${VERSION}" --app-version "${VERSION}" --destination chart-dist/
          helm push "chart-dist/bigipreport-${VERSION}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
