name: Clean up old package versions

on:
  schedule:
    - cron: "0 3 * * 0"  # Every Sunday at 03:00 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only log what would be deleted"
        type: boolean
        default: true

permissions:
  contents: none
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        package:
          - bigipreport-frontend
          - bigipreport-data-collector
          - charts/bigipreport

    steps:
      # Only PR preview tags (pr-N, sha-xxxxxxx, chart 0.0.0-sha.xxxxxxx) and
      # untagged versions are removed. Release tags and latest are always kept,
      # as are platform/attestation children of kept images.
      - name: Delete PR preview and untagged versions older than 30 days
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: ${{ matrix.package }}
          use-regex: true
          delete-tags: '^(pr-\d+|sha-[0-9a-f]+|0\.0\.0-sha\.[0-9a-f]+)$'
          exclude-tags: '^v?\d+\.\d+(\.\d+)?$|^latest$'
          delete-untagged: true
          older-than: 30 days
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
