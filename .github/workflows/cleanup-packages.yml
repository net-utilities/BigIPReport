name: Clean up old package versions

on:
  schedule:
    - cron: "0 3 * * 0"  # Every Sunday at 03:00 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only log what would be deleted"
        type: boolean
        default: true

permissions:
  contents: none
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        package:
          - bigipreport-frontend
          - bigipreport-data-collector
          - charts/bigipreport

    steps:
      - name: Delete PR preview and untagged versions older than 30 days
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: ${{ matrix.package }}
          use-regex: true
          delete-tags: '^(pr-\d+|sha-[0-9a-f]+|0\.0\.0-sha\.[0-9a-f]+)$'
          exclude-tags: '^v?\d+\.\d+$|^v?\d+\.\d+\.\d+$|^latest$'
          delete-untagged: true
          older-than: 30 days
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
